<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>YugoTool</title>
    <style>
      :root {
        --background: oklch(0.145 0.004 260);
        --card: oklch(0.175 0.005 260);
        --border: oklch(1 0 0 / 8%);
        --foreground: oklch(0.96 0.003 260);
        --muted: oklch(0.66 0.01 260);
        --brand: oklch(0.58 0.21 25);
        --passed: oklch(0.72 0.15 155);
        --failed: oklch(0.65 0.2 25);
        --running: oklch(0.7 0.12 250);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --background: oklch(0.985 0.002 260);
          --card: oklch(1 0 0);
          --border: oklch(0 0 0 / 9%);
          --foreground: oklch(0.2 0.006 260);
          --muted: oklch(0.5 0.01 260);
          --passed: oklch(0.55 0.15 155);
          --failed: oklch(0.55 0.2 25);
          --running: oklch(0.55 0.14 250);
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          system-ui,
          sans-serif;
        -webkit-app-region: drag;
      }
      main {
        width: 360px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .mark svg {
        color: var(--brand);
      }
      .word {
        font-weight: 600;
        letter-spacing: 0.12em;
        font-size: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 0;
      }
      .row {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 14px;
      }
      .row .state {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1.5px solid var(--muted);
        justify-self: center;
      }
      .running .dot,
      .done .dot {
        background: var(--passed);
        border-color: var(--passed);
      }
      .starting .dot,
      .restarting .dot {
        border-color: var(--running);
        border-top-color: transparent;
        width: 10px;
        height: 10px;
        animation: spin 0.8s linear infinite;
      }
      .failed .dot {
        background: var(--failed);
        border-color: var(--failed);
        border-radius: 2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .starting .dot,
        .restarting .dot,
        .bar.indeterminate span {
          animation: none;
        }
      }
      .bar {
        grid-column: 2 / 4;
        height: 4px;
        margin: -6px 0 8px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--running);
        transition: width 0.2s linear;
      }
      .bar.indeterminate span {
        width: 30%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      .row.has-progress {
        height: auto;
        min-height: 34px;
        grid-template-rows: 34px auto;
      }
      .hint {
        color: var(--muted);
        margin-top: 14px;
        min-height: 40px;
      }
      .error {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        border: 1px solid var(--failed);
        border-radius: 10px;
      }
      .error p {
        margin: 0 0 10px;
        word-break: break-word;
      }
      .actions {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
        cursor: pointer;
      }
      button.primary {
        background: var(--foreground);
        color: var(--background);
        border-color: transparent;
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <path
            fill="currentColor"
            d="M17.19 4.66 L17.57 1.08 L19.67 1.69 Q23.37 3.98 22.7 6.78 L22.7 6.78 L24.82 3.86 L26.34 5.44 Q28.39 9.27 26.41 11.36 L26.41 11.36 L29.7 9.9 L30.23 12.03 Q30.1 16.37 27.34 17.19 L27.34 17.19 L30.92 17.57 L30.31 19.67 Q28.02 23.37 25.22 22.7 L25.22 22.7 L28.14 24.82 L26.56 26.34 Q22.73 28.39 20.64 26.41 L20.64 26.41 L22.1 29.7 L19.97 30.23 Q15.63 30.1 14.81 27.34 L14.81 27.34 L14.43 30.92 L12.33 30.31 Q8.63 28.02 9.3 25.22 L9.3 25.22 L7.18 28.14 L5.66 26.56 Q3.61 22.73 5.59 20.64 L5.59 20.64 L2.3 22.1 L1.77 19.97 Q1.9 15.63 4.66 14.81 L4.66 14.81 L1.08 14.43 L1.69 12.33 Q3.98 8.63 6.78 9.3 L6.78 9.3 L3.86 7.18 L5.44 5.66 Q9.27 3.61 11.36 5.59 L11.36 5.59 L9.9 2.3 L12.03 1.77 Q16.37 1.9 17.19 4.66 Z"
          />
          <circle cx="16" cy="16" r="9.6" fill="#16181d" />
          <path
            d="M11.22 10.48 L16 16.18 L20.78 10.48 M16 16.18 V22.44"
            stroke="#f4f1ea"
            stroke-width="2.8"
            fill="none"
          />
        </svg>
        <span class="word">YugoTool</span>
      </div>
      <div class="card" id="services" role="status" aria-live="polite"></div>
      <p class="hint" id="hint">Starting the factory…</p>
      <div class="error" id="error" role="alert">
        <p id="error-text"></p>
        <div class="actions">
          <button class="primary" id="retry">Try again</button>
          <button id="logs">Open logs</button>
        </div>
      </div>
    </main>
    <script>
      const LABELS = {
        runtime: "Claude Code + workflow engine",
        postgres: "Database",
        migrations: "Migrations",
        folders: "Folder access",
        temporal: "Workflow engine",
        api: "API",
        worker: "Worker",
      };
      const STATES = {
        stopped: "Waiting",
        starting: "Starting…",
        running: "Ready",
        done: "Done",
        restarting: "Restarting…",
        failed: "Failed",
      };
      const order = ["runtime", "postgres", "migrations", "folders", "temporal", "api", "worker"];
      const services = document.getElementById("services");
      const hint = document.getElementById("hint");
      const HINT = "Starting the factory…";
      const render = (status) => {
        const byName = Object.fromEntries((status?.services ?? []).map((s) => [s.name, s]));
        // Nothing to fetch (a checkout) or no guarded folder in use: no row.
        const shown = order.filter(
          (name) =>
            !((name === "runtime" || name === "folders") && byName[name]?.detail === "not needed"),
        );
        services.replaceChildren(
          ...shown.map((name) => {
            const s = byName[name] ?? { state: "stopped" };
            const row = document.createElement("div");
            row.className = `row ${s.state}`;
            row.innerHTML =
              '<span class="dot"></span><span class="name"></span><span class="state"></span>';
            row.querySelector(".name").textContent = LABELS[name];
            row.querySelector(".state").textContent = STATES[s.state];
            if (name === "folders" && s.state === "starting" && s.progress) {
              row.querySelector(".state").textContent = "Waiting for you";
            } else if (s.state === "starting" && s.progress) {
              const { done, total } = s.progress;
              const pct = total ? Math.min(100, Math.round((done / total) * 100)) : null;
              row.classList.add("has-progress");
              row.querySelector(".state").textContent = pct === null ? "Downloading…" : `${pct}%`;
              const bar = document.createElement("div");
              bar.className = pct === null ? "bar indeterminate" : "bar";
              bar.setAttribute("role", "progressbar");
              bar.setAttribute("aria-label", "Download");
              if (pct !== null) bar.setAttribute("aria-valuenow", String(pct));
              const fill = document.createElement("span");
              if (pct !== null) fill.style.width = `${pct}%`;
              bar.append(fill);
              row.append(bar);
            }
            return row;
          }),
        );
        if (document.getElementById("error").style.display === "block") return;
        const fetching = byName.runtime?.state === "starting" ? byName.runtime : null;
        const asking = byName.folders?.state === "starting" ? byName.folders : null;
        hint.textContent = asking?.progress
          ? `macOS is asking: click Allow to ${asking.detail}. Don't see the dialog? System Settings → Privacy & Security → Files and Folders → YugoTool.`
          : fetching?.progress
            ? `First start: ${fetching.detail}. This happens once.`
            : HINT;
      };
      render(null);
      const desktop = window.yugotoolDesktop;
      desktop?.onStatus(render);
      desktop?.onFailed((failure) => {
        document.getElementById("hint").textContent = "";
        document.getElementById("error-text").textContent =
          `YugoTool couldn't start: ${failure.message}`;
        document.getElementById("error").style.display = "block";
      });
      document.getElementById("retry").addEventListener("click", () => {
        document.getElementById("error").style.display = "none";
        hint.textContent = HINT;
        void desktop?.retry();
      });
      document.getElementById("logs").addEventListener("click", () => void desktop?.openLogs());
    </script>
  </body>
</html>
